/* Scanline overlay */
body::before {

transparent,
transparent 2px,
rgba(0,255,200,0.015) 2px,
rgba(0,255,200,0.015) 4px

header {

}

}

left: 14px;

border-radius: 4px;
box-shadow: 0 0 20px #ff00aa40, 0 6px 24px rgba(0,0,0,0.6);

overflow-y: auto;
}

.menu-section + .menu-section {

}

.menu-label {

letter-spacing: 2px;
color: #5a5a8a;

}

.menu-save-row {

gap: 6px;
}

.menu-input {

background: #0d0d20;
border: 1px solid #2a2a5a;
border-radius: 3px;
color: #a0a0ff;
font-family: 'Courier New', monospace;
font-size: 11px;

.menu-input:focus {

}

.menu-btn-action {

border: 1px solid #ff00aa;
color: #ff00aa;
font-family: 'Courier New', monospace;
font-size: 10px;
letter-spacing: 1px;
padding: 5px 10px;
border-radius: 3px;
cursor: pointer;
white-space: nowrap;
text-shadow: 0 0 6px #ff00aa;
transition: all 0.15s;
}

.menu-btn-action:active {
background: #ff00aa20;
box-shadow: 0 0 12px #ff00aa60;
}

.save-list-empty {
font-size: 10px;
color: #3a3a6a;
letter-spacing: 1px;
padding: 10px 0;
text-align: center;
}

.save-item {
display: flex;
align-items: center;
gap: 6px;
padding: 7px 0;
border-bottom: 1px solid #111128;
}

.save-item:last-child {
border-bottom: none;
}

.save-item-info {
flex: 1;
min-width: 0;
}

.save-item-name {
font-size: 11px;
color: #00ffe0;
letter-spacing: 1px;
overflow: hidden;
text-overflow: ellipsis;
white-space: nowrap;
}

.save-item-meta {
font-size: 9px;
color: #5a5a8a;
margin-top: 2px;
}

.save-item-btn {
background: transparent;
border: 1px solid #aa00ff44;
color: #aa00ff;
font-family: 'Courier New', monospace;
font-size: 9px;
padding: 4px 7px;
border-radius: 3px;
cursor: pointer;
white-space: nowrap;
transition: all 0.15s;
}

.save-item-btn:active {
background: #aa00ff20;
}

.save-item-btn.danger {
border-color: #ff004466;
color: #ff0044;
}

.save-item-btn.danger:active {
background: #ff004420;
}

.panels {
display: flex;
flex-direction: column;
gap: 0;
padding: 0;
}

/* ── PANEL BASE ── */
.panel {
border-bottom: 1px solid #1a1a3a;
background: #07070f;
position: relative;
}

.panel-header {
display: flex;
align-items: center;
gap: 8px;
padding: 7px 10px 5px;
background: #0a0a18;
border-bottom: 1px solid #1a1a3a;
}

.panel-num {
font-size: 9px;
letter-spacing: 2px;
color: #ff00aa;
text-shadow: 0 0 6px #ff00aa;
}

.panel-label {
font-size: 10px;
letter-spacing: 3px;
color: #00ffe0;
flex: 1;
text-shadow: 0 0 6px #00ffe060;
}

/* URL input row */
.url-row {
display: flex;
gap: 6px;
padding: 6px 8px;
background: #050510;
border-bottom: 1px solid #111128;
}

.url-input {
flex: 1;
background: #0d0d20;
border: 1px solid #2a2a5a;
border-radius: 3px;
color: #a0a0ff;
font-family: 'Courier New', monospace;
font-size: 11px;
padding: 5px 8px;
outline: none;
transition: border-color 0.2s;
}

.url-input:focus {
border-color: #00ffe0;
box-shadow: 0 0 6px #00ffe040;
}

.url-input::placeholder {
color: #3a3a6a;
}

.btn-load {
background: transparent;
border: 1px solid #00ffe0;
color: #00ffe0;
font-family: 'Courier New', monospace;
font-size: 10px;
letter-spacing: 1px;
padding: 5px 10px;
border-radius: 3px;
cursor: pointer;
text-shadow: 0 0 6px #00ffe0;
box-shadow: 0 0 6px #00ffe020;
transition: all 0.15s;
white-space: nowrap;
}

.btn-load:active {
background: #00ffe020;
box-shadow: 0 0 12px #00ffe060;
}

/* Video frame */
.video-frame {
position: relative;
width: 100%;
padding-bottom: 56.25%;
background: #02020a;
overflow: hidden;
}

.video-frame iframe {
position: absolute;
top: 0; left: 0;
width: 100%; height: 100%;

}

.video-placeholder {
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 8px;
color: #2a2a5a;
}

.video-placeholder .icon {
font-size: 32px;
opacity: 0.4;
}

.video-placeholder .txt {
font-size: 10px;
letter-spacing: 2px;
color: #2a2a5a;
}

/* Video controls */
.vid-controls {
display: flex;
align-items: center;
gap: 6px;
padding: 6px 8px;
background: #060610;
border-top: 1px solid #111128;
flex-wrap: wrap;
}

.ctrl-btn {
background: transparent;
border: 1px solid #ff00aa44;
color: #ff00aa;
font-family: 'Courier New', monospace;
font-size: 10px;
padding: 4px 8px;
border-radius: 3px;
cursor: pointer;
letter-spacing: 1px;
transition: all 0.15s;
text-shadow: 0 0 4px #ff00aa80;
}

.ctrl-btn:active {
background: #ff00aa20;
box-shadow: 0 0 8px #ff00aa60;
}

.ctrl-btn.muted {
color: #555588;
border-color: #33334a;
text-shadow: none;
}

.ctrl-btn.pip-btn {
color: #aa00ff;
border-color: #aa00ff44;
text-shadow: 0 0 4px #aa00ff80;
margin-left: auto;
}

.ctrl-btn.pip-btn:active {
background: #aa00ff20;
}

/* ── GIF PANEL ── */
.gif-panel {
border-bottom: none;
}

.gif-display {
width: 100%;
min-height: 200px;
background: #02020a;
display: flex;
align-items: center;
justify-content: center;
position: relative;
overflow: hidden;
}

.gif-display.slot-active {
min-height: 340px;
}

.gif-display img {
width: 100%;
height: 100%;
object-fit: contain;
display: block;
max-height: 240px;
}

.gif-display .gif-placeholder {
display: flex;
flex-direction: column;
align-items: center;
gap: 8px;
color: #2a2a5a;
}

.gif-display .gif-placeholder .icon {
font-size: 36px;
opacity: 0.3;
}

.gif-display .gif-placeholder .txt {
font-size: 10px;
letter-spacing: 2px;
}

/* Full-size sequential gif window */
.gif-main-frame {
position: relative;
width: 100%;
padding-bottom: 56.25%;
background: #02020a;
overflow: hidden;
}

.gif-main-frame img {
position: absolute;
top: 0; left: 0;
width: 100%; height: 100%;
object-fit: contain;
display: block;
}

.gif-main-frame .gif-placeholder {
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 8px;
color: #2a2a5a;
}

.gif-main-frame .gif-placeholder .icon {
font-size: 36px;
opacity: 0.3;
}

.gif-main-frame .gif-placeholder .txt {
font-size: 10px;
letter-spacing: 2px;
}

.gif-counter {
position: absolute;
top: 6px;
right: 8px;
font-size: 10px;
letter-spacing: 2px;
color: #aa00ff;
text-shadow: 0 0 6px #aa00ff;
background: #02020acc;
padding: 2px 6px;
border-radius: 2px;
}

/* Progress bar */
.gif-progress {
height: 2px;
background: #1a1a3a;
position: relative;
}

.gif-progress-bar {
height: 100%;
background: linear-gradient(90deg, #aa00ff, #ff00aa);
box-shadow: 0 0 6px #ff00aa;
width: 0%;
transition: width 0.1s linear;
}

/* GIF controls */
.gif-controls {
display: flex;
align-items: center;
gap: 6px;
padding: 6px 8px;
background: #060610;
border-top: 1px solid #111128;
}

.gif-btn {
background: transparent;
border: 1px solid #aa00ff44;
color: #aa00ff;
font-family: 'Courier New', monospace;
font-size: 11px;
padding: 5px 10px;
border-radius: 3px;
cursor: pointer;

}

.gif-btn:active {
background: #aa00ff20;
box-shadow: 0 0 8px #aa00ff60;
}

.gif-btn.paused {
color: #555588;
border-color: #33334a;
text-shadow: none;
}

.gif-info {
flex: 1;
font-size: 10px;
color: #5a5a8a;
letter-spacing: 1px;
text-align: center;
}

/* GIF URL list */
.gif-list-area {
padding: 6px 8px;
background: #050510;
border-top: 1px solid #111128;
}

.gif-list-label {
font-size: 9px;
letter-spacing: 2px;
color: #5a5a8a;
margin-bottom: 4px;
}

.gif-textarea {
width: 100%;
background: #0d0d20;
border: 1px solid #2a2a5a;
border-radius: 3px;
color: #a0a0ff;
font-family: 'Courier New', monospace;
font-size: 11px;
padding: 6px 8px;
height: 80px;
resize: none;
outline: none;
transition: border-color 0.2s;
}

.gif-textarea:focus {
border-color: #aa00ff;
box-shadow: 0 0 6px #aa00ff40;
}

.gif-textarea::placeholder {
color: #2a2a5a;
}

.gif-load-row {
display: flex;
gap: 6px;
margin-top: 5px;
}

.btn-gif-load {
flex: 1;
background: transparent;
border: 1px solid #aa00ff;
color: #aa00ff;
font-family: 'Courier New', monospace;
font-size: 10px;
letter-spacing: 2px;
padding: 6px;
border-radius: 3px;
cursor: pointer;
text-shadow: 0 0 6px #aa00ff;
box-shadow: 0 0 6px #aa00ff20;
transition: all 0.15s;
}

.btn-gif-load:active {
background: #aa00ff20;
box-shadow: 0 0 12px #aa00ff60;
}

.btn-slot {
border-color: #ff00aa;
color: #ff00aa;
text-shadow: 0 0 6px #ff00aa;
box-shadow: 0 0 6px #ff00aa20;
}

.btn-slot:active {
background: #ff00aa20;
box-shadow: 0 0 12px #ff00aa60;
}

.btn-slot.active {
background: #ff00aa20;
box-shadow: 0 0 14px #ff00aa90;
animation: slotPulse 1.4s infinite;
}

@keyframes slotPulse {
0%, 100% { box-shadow: 0 0 8px #ff00aa60; }
50% { box-shadow: 0 0 18px #ff00aaa0; }
}

/* Slot machine layout picker */
.slot-mode-row {
display: flex;
gap: 6px;
margin-top: 5px;
}

.slot-mode-btn {
flex: 1;
background: transparent;
border: 1px solid #55336a;
color: #7a5aa8;
font-family: 'Courier New', monospace;
font-size: 9px;
letter-spacing: 1px;
padding: 5px;
border-radius: 3px;
cursor: pointer;
transition: all 0.15s;
}

.slot-mode-btn.active {
border-color: #ff00aa;
color: #ff00aa;
text-shadow: 0 0 6px #ff00aa;
box-shadow: 0 0 6px #ff00aa30;
}

/* ── SLOT MACHINE GRID ── */
.slot-grid {
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
display: grid;
grid-template-columns: repeat(3, 1fr);
grid-template-rows: repeat(3, 1fr);
gap: 2px;
background: #1a1a3a;
}

.slot-tile {
position: relative;
overflow: hidden;
background: #02020a;
}

.slot-tile img {
width: 100%;
height: 100%;
object-fit: cover;
display: block;
opacity: 0;
transition: opacity 0.25s ease;
}

.slot-tile img.loaded {
opacity: 1;
}

.slot-tile .slot-tile-placeholder {
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
display: flex;
align-items: center;
justify-content: center;
color: #2a2a5a;
font-size: 16px;
}

/* Corner decorations */
.corner-tl, .corner-br {
position: absolute;
width: 10px;
height: 10px;
pointer-events: none;
}
.corner-tl {
top: 0; left: 0;
border-top: 2px solid #00ffe0;
border-left: 2px solid #00ffe0;
}
.corner-br {
bottom: 0; right: 0;
border-bottom: 2px solid #00ffe0;
border-right: 2px solid #00ffe0;
}

.divider {
height: 1px;
background: linear-gradient(90deg, transparent, #00ffe040, transparent);
margin: 0;
}

footer {
padding: 10px;
text-align: center;
font-size: 9px;
letter-spacing: 3px;
color: #2a2a4a;
border-top: 1px solid #1a1a3a;
}
</style>

</head>

  </div>

</div>

<footer>QUAD//FEED v1.0 &mdash; ALL SYSTEMS NOMINAL</footer>

<script>
// ── YOUTUBE HELPERS ──────────────────────────────────────────
var muteState = { 1: false, 2: false, 3: false };
var players = {};

function extractVideoId(url) {
  url = url.trim();
  // youtu.be/ID
  var m = url.match(/youtu\.be\/([^?&\s]+)/);
  if (m) return m[1];
  // v=ID
  m = url.match(/[?&]v=([^?&\s]+)/);
  if (m) return m[1];
  // embed/ID
  m = url.match(/embed\/([^?&\s]+)/);
  if (m) return m[1];
  // shorts/ID
  m = url.match(/shorts\/([^?&\s]+)/);
  if (m) return m[1];
  return null;
}

function loadVideo(n) {
  var input = document.getElementById('url' + n);
  var url = input.value.trim();
  if (!url) { alert('Paste a YouTube link first.'); return; }

  var vid = extractVideoId(url);
  if (!vid) { alert('Could not find a YouTube video ID in that link.'); return; }

  var frame = document.getElementById('frame' + n);

  // Build embed URL with controls, enablejsapi
  var src = 'https://www.youtube.com/embed/' + vid +
    '?enablejsapi=1&controls=1&rel=0&modestbranding=1&playsinline=1';

  frame.innerHTML =
    '<iframe id="yt' + n + '" src="' + src + '" ' +
    'allow="autoplay; fullscreen; picture-in-picture" ' +
    'allowfullscreen playsinline></iframe>' +
    '<div class="corner-tl"></div><div class="corner-br"></div>';

  players[n] = document.getElementById('yt' + n);

  // Reset mute button
  muteState[n] = false;
  var mb = document.getElementById('muteBtn' + n);
  mb.textContent = 'MUTE';
  mb.classList.remove('muted');
}

function sendYTCommand(n, func, args) {
  var iframe = players[n] || document.getElementById('yt' + n);
  if (!iframe) return;
  try {
    var cmd = JSON.stringify({ event: 'command', func: func, args: args || [] });
    iframe.contentWindow.postMessage(cmd, '*');
  } catch(e) {}
}

function toggleMute(n) {
  var btn = document.getElementById('muteBtn' + n);
  muteState[n] = !muteState[n];
  if (muteState[n]) {
    sendYTCommand(n, 'mute');
    btn.textContent = 'UNMUTE';
    btn.classList.add('muted');
  } else {
    sendYTCommand(n, 'unMute');
    btn.textContent = 'MUTE';
    btn.classList.remove('muted');
  }
}

function seekVideo(n, secs) {
  // We use postMessage to get current time then seek
  // Simple approach: just send seekBy via YT API
  var iframe = players[n] || document.getElementById('yt' + n);
  if (!iframe) return;
  // YT iframe API seekTo isn't trivially available without full API load
  // We'll reload the iframe at a rough offset using &start param as fallback
  // Better: use postMessage getCurrentTime then seekTo
  try {
    iframe.contentWindow.postMessage(
      JSON.stringify({ event: 'command', func: 'seekTo',
        args: [0, true] }), '*'
    );
  } catch(e) {}
  // Because we can't easily get current time without full YT API,
  // show a toast hint
  showToast('Use the YouTube player bar to scrub', 1800);
}

function requestPiP(n) {
  var iframe = players[n] || document.getElementById('yt' + n);
  if (!iframe) { showToast('Load a video first', 1500); return; }
  try {
    if (document.pictureInPictureElement) {
      document.exitPictureInPicture();
    } else {
      showToast('Tap fullscreen then use iOS PiP button', 2500);
    }
  } catch(e) {
    showToast('Tap fullscreen then use iOS PiP button', 2500);
  }
}

// ── TOAST ──────────────────────────────────────────────────
var toastEl = null;
function showToast(msg, dur) {
  if (!toastEl) {
    toastEl = document.createElement('div');
    toastEl.style.cssText =
      'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);' +
      'background:#aa00ffcc;color:#fff;font-family:Courier New,monospace;' +
      'font-size:11px;letter-spacing:1px;padding:8px 16px;border-radius:4px;' +
      'z-index:9998;pointer-events:none;transition:opacity 0.3s;';
    document.body.appendChild(toastEl);
  }
  toastEl.textContent = msg;
  toastEl.style.opacity = '1';
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(function() {
    toastEl.style.opacity = '0';
  }, dur || 2000);
}

// ── GIF SLIDESHOW ──────────────────────────────────────────
var gifQueue = [];
var gifIndex = 0;
var gifPaused = false;
var gifTimer = null;
var gifProgressTimer = null;
var gifDuration = 10000; // 10 seconds
var gifProgressStart = 0;

function loadGifQueue() {
  var ta = document.getElementById('gifTextarea');
  var lines = ta.value.split('\n');
  var urls = [];
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (line.length > 4) urls.push(line);
  }
  if (urls.length === 0) {
    showToast('Paste at least one GIF URL', 2000);
    return;
  }
  if (slotActive) exitSlotUI();
  gifQueue = urls;
  gifIndex = 0;
  gifPaused = false;
  var pb = document.getElementById('gifPauseBtn');
  pb.textContent = 'PAUSE';
  pb.classList.remove('paused');
  showGif(0);
  startGifTimer();

  mainGifIndex = 0;
  mainGifPaused = false;
  var mpb = document.getElementById('gifMainPauseBtn');
  mpb.textContent = 'PAUSE';
  mpb.classList.remove('paused');
  showMainGif(0);
  startMainGifTimer();

  showToast(urls.length + ' GIF' + (urls.length > 1 ? 'S' : '') + ' LOADED', 2000);
}

function showGif(idx) {
  if (gifQueue.length === 0) return;
  gifIndex = ((idx % gifQueue.length) + gifQueue.length) % gifQueue.length;

  var img = document.getElementById('gifImg');
  var ph = document.getElementById('gifPlaceholder');
  var counter = document.getElementById('gifCounter');
  var info = document.getElementById('gifInfo');

  img.style.display = 'none';
  img.src = '';

  img.onload = function() {
    ph.style.display = 'none';
    img.style.display = 'block';
  };
  img.onerror = function() {
    ph.style.display = 'flex';
    img.style.display = 'none';
    document.getElementById('gifPlaceholder').querySelector('.txt').textContent = 'LOAD ERROR';
  };
  img.src = gifQueue[gifIndex];

  counter.style.display = 'block';
  counter.textContent = (gifIndex + 1) + ' / ' + gifQueue.length;
  info.textContent = (gifIndex + 1) + ' of ' + gifQueue.length;

  // Reset progress bar
  resetProgressBar();
}

function resetProgressBar() {
  var bar = document.getElementById('gifProgressBar');
  bar.style.width = '0%';
  gifProgressStart = Date.now();
  if (gifProgressTimer) clearInterval(gifProgressTimer);
  if (!gifPaused) {
    gifProgressTimer = setInterval(function() {
      var elapsed = Date.now() - gifProgressStart;
      var pct = Math.min(100, (elapsed / gifDuration) * 100);
      bar.style.width = pct + '%';
    }, 80);
  }
}

function startGifTimer() {
  clearTimeout(gifTimer);
  if (gifQueue.length <= 1 || gifPaused) return;
  gifTimer = setTimeout(function() {
    gifNext();
  }, gifDuration);
}

function gifNext() {
  if (gifQueue.length === 0) return;
  showGif(gifIndex + 1);
  if (!gifPaused) startGifTimer();
}

function gifPrev() {
  if (gifQueue.length === 0) return;
  clearTimeout(gifTimer);
  showGif(gifIndex - 1);
  if (!gifPaused) startGifTimer();
}

function toggleGifPause() {
  var btn = document.getElementById('gifPauseBtn');
  gifPaused = !gifPaused;
  if (gifPaused) {
    clearTimeout(gifTimer);
    clearInterval(gifProgressTimer);
    btn.textContent = 'PLAY';
    btn.classList.add('paused');
    showToast('GIF SLIDESHOW PAUSED', 1500);
  } else {
    btn.textContent = 'PAUSE';
    btn.classList.remove('paused');
    resetProgressBar();
    startGifTimer();
    showToast('GIF SLIDESHOW RESUMED', 1500);
  }
}

// ── GIF MAIN (full-size, sequential, in order) ──────────────
var mainGifIndex = 0;
var mainGifPaused = false;
var mainGifTimer = null;
var mainGifProgressTimer = null;
var mainGifProgressStart = 0;

function showMainGif(idx) {
  if (gifQueue.length === 0) return;
  mainGifIndex = ((idx % gifQueue.length) + gifQueue.length) % gifQueue.length;

  var img = document.getElementById('gifMainImg');
  var ph = document.getElementById('gifMainPlaceholder');
  var counter = document.getElementById('gifMainCounter');
  var info = document.getElementById('gifMainInfo');

  img.style.display = 'none';
  img.src = '';

  img.onload = function() {
    ph.style.display = 'none';
    img.style.display = 'block';
  };
  img.onerror = function() {
    ph.style.display = 'flex';
    img.style.display = 'none';
    ph.querySelector('.txt').textContent = 'LOAD ERROR';
  };
  img.src = gifQueue[mainGifIndex];

  counter.style.display = 'block';
  counter.textContent = (mainGifIndex + 1) + ' / ' + gifQueue.length;
  info.textContent = (mainGifIndex + 1) + ' of ' + gifQueue.length;

  resetMainProgressBar();
}

function resetMainProgressBar() {
  var bar = document.getElementById('gifMainProgressBar');
  bar.style.width = '0%';
  mainGifProgressStart = Date.now();
  if (mainGifProgressTimer) clearInterval(mainGifProgressTimer);
  if (!mainGifPaused) {
    mainGifProgressTimer = setInterval(function() {
      var elapsed = Date.now() - mainGifProgressStart;
      var pct = Math.min(100, (elapsed / gifDuration) * 100);
      bar.style.width = pct + '%';
    }, 80);
  }
}

function startMainGifTimer() {
  clearTimeout(mainGifTimer);
  if (gifQueue.length <= 1 || mainGifPaused) return;
  mainGifTimer = setTimeout(function() {
    mainGifNext();
  }, gifDuration);
}

function mainGifNext() {
  if (gifQueue.length === 0) return;
  showMainGif(mainGifIndex + 1);
  if (!mainGifPaused) startMainGifTimer();
}

function mainGifPrev() {
  if (gifQueue.length === 0) return;
  clearTimeout(mainGifTimer);
  showMainGif(mainGifIndex - 1);
  if (!mainGifPaused) startMainGifTimer();
}

function toggleMainGifPause() {
  var btn = document.getElementById('gifMainPauseBtn');
  mainGifPaused = !mainGifPaused;
  if (mainGifPaused) {
    clearTimeout(mainGifTimer);
    clearInterval(mainGifProgressTimer);
    btn.textContent = 'PLAY';
    btn.classList.add('paused');
    showToast('MAIN GIF PAUSED', 1500);
  } else {
    btn.textContent = 'PAUSE';
    btn.classList.remove('paused');
    resetMainProgressBar();
    startMainGifTimer();
    showToast('MAIN GIF RESUMED', 1500);
  }
}

// ── SLOT MACHINE MODE ───────────────────────────────────────
var SLOT_MODES = {
  nine:  { count: 9, cols: 3, rows: 3, minHeight: 340, label: '3×3 (9 GIFS)' },
  three: { count: 3, cols: 3, rows: 1, minHeight: 200, label: '3 SIDE BY SIDE' }
};
var slotMode = 'nine';
var slotActive = false;
var slotTimers = [];
var slotTileGif = [];

function setSlotMode(mode) {
  if (!SLOT_MODES[mode]) return;
  slotMode = mode;
  document.getElementById('modeBtn9').classList.toggle('active', mode === 'nine');
  document.getElementById('modeBtn3').classList.toggle('active', mode === 'three');
  if (slotActive) startSlotMachine(); // live-switch layout without stopping
}

function toggleSlotMachine() {
  if (slotActive) {
    stopSlotMachine();
  } else {
    startSlotMachine();
  }
}

function startSlotMachine() {
  if (gifQueue.length === 0) {
    var ta = document.getElementById('gifTextarea');
    if (ta.value.trim().length > 0) loadGifQueue();
  }
  if (gifQueue.length === 0) {
    showToast('Load at least one GIF URL first', 2000);
    return;
  }

  var config = SLOT_MODES[slotMode];

  slotActive = true;
  clearTimeout(gifTimer);
  clearInterval(gifProgressTimer);

  document.getElementById('gifImg').style.display = 'none';
  document.getElementById('gifPlaceholder').style.display = 'none';
  document.getElementById('gifCounter').style.display = 'none';
  document.getElementById('gifProgressWrap').style.display = 'none';
  document.getElementById('gifControls').style.display = 'none';
  var displayEl = document.getElementById('gifDisplay');
  displayEl.classList.add('slot-active');
  displayEl.style.minHeight = config.minHeight + 'px';

  var grid = document.getElementById('slotGrid');
  grid.innerHTML = '';
  grid.style.display = 'grid';
  grid.style.gridTemplateColumns = 'repeat(' + config.cols + ', 1fr)';
  grid.style.gridTemplateRows = 'repeat(' + config.rows + ', 1fr)';

  slotTileGif = [];
  slotTimers.forEach(function(t) { clearTimeout(t); });
  slotTimers = [];

  for (var i = 0; i < config.count; i++) {
    var tile = document.createElement('div');
    tile.className = 'slot-tile';
    tile.id = 'slotTile' + i;
    grid.appendChild(tile);
    slotTileGif.push(null);
    swapTileGif(i);
    scheduleTile(i);
  }

  var btn = document.getElementById('slotBtn');
  btn.textContent = '■ STOP SLOT MACHINE';
  btn.classList.add('active');
  showToast('SLOT MACHINE ENGAGED — ' + config.label, 2000);
}

function exitSlotUI() {
  slotActive = false;
  slotTimers.forEach(function(t) { clearTimeout(t); });
  slotTimers = [];
  document.getElementById('slotGrid').style.display = 'none';
  var displayEl = document.getElementById('gifDisplay');
  displayEl.classList.remove('slot-active');
  displayEl.style.minHeight = '';
  document.getElementById('gifProgressWrap').style.display = '';
  document.getElementById('gifControls').style.display = '';
  var btn = document.getElementById('slotBtn');
  btn.textContent = '🎰 SLOT MACHINE';
  btn.classList.remove('active');
}

function stopSlotMachine() {
  exitSlotUI();
  if (gifQueue.length > 0) {
    showGif(gifIndex);
    startGifTimer();
  }
  showToast('SLOT MACHINE STOPPED', 1500);
}

function pickTileGif(tileIdx) {
  if (gifQueue.length === 0) return null;
  if (gifQueue.length === 1) return gifQueue[0];

  var exclude = {};
  for (var i = 0; i < slotTileGif.length; i++) {
    if (i !== tileIdx && slotTileGif[i]) exclude[slotTileGif[i]] = true;
  }
  if (slotTileGif[tileIdx]) exclude[slotTileGif[tileIdx]] = true;

  var candidates = gifQueue.filter(function(u) { return !exclude[u]; });
  if (candidates.length === 0) {
    candidates = gifQueue.filter(function(u) { return u !== slotTileGif[tileIdx]; });
  }
  if (candidates.length === 0) candidates = gifQueue;

  return candidates[Math.floor(Math.random() * candidates.length)];
}

function swapTileGif(tileIdx) {
  if (!slotActive) return;
  var url = pickTileGif(tileIdx);
  if (!url) return;
  slotTileGif[tileIdx] = url;

  var tile = document.getElementById('slotTile' + tileIdx);
  if (!tile) return;

  var img = document.createElement('img');
  img.onload = function() {
    if (!slotActive) return;
    tile.innerHTML = '';
    img.classList.add('loaded');
    tile.appendChild(img);
  };
  img.onerror = function() {
    if (!slotActive) return;
    tile.innerHTML = '';
    var ph = document.createElement('div');
    ph.className = 'slot-tile-placeholder';
    ph.textContent = '✖';
    tile.appendChild(ph);
  };
  img.src = url;
}

function scheduleTile(tileIdx) {
  if (!slotActive) return;
  var delay = 10000 + Math.random() * 5000; // random 10-15s per reel
  slotTimers[tileIdx] = setTimeout(function() {
    swapTileGif(tileIdx);
    scheduleTile(tileIdx);
  }, delay);
}

// ── SAVE / LOAD STATE ───────────────────────────────────────
var SAVE_STORAGE_KEY = 'quadfeed_saves';

function toggleMenu() {
  var panel = document.getElementById('menuPanel');
  var btn = document.getElementById('menuBtn');
  var isOpen = panel.style.display === 'block';
  if (isOpen) {
    panel.style.display = 'none';
    btn.classList.remove('open');
  } else {
    renderSaveList();
    panel.style.display = 'block';
    btn.classList.add('open');
  }
}

document.addEventListener('click', function(e) {
  var panel = document.getElementById('menuPanel');
  var btn = document.getElementById('menuBtn');
  if (panel.style.display === 'block' && !panel.contains(e.target) && e.target !== btn) {
    panel.style.display = 'none';
    btn.classList.remove('open');
  }
});

function getSaves() {
  try {
    var raw = localStorage.getItem(SAVE_STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function setSaves(saves) {
  try {
    localStorage.setItem(SAVE_STORAGE_KEY, JSON.stringify(saves));
  } catch (e) {
    showToast('Could not save (storage unavailable)', 2500);
  }
}

function saveState() {
  var input = document.getElementById('saveNameInput');
  var name = input.value.trim();
  if (!name) {
    showToast('Enter a save name first', 2000);
    return;
  }

  var videos = [
    document.getElementById('url1').value.trim(),
    document.getElementById('url2').value.trim(),
    document.getElementById('url3').value.trim()
  ];
  var gifText = document.getElementById('gifTextarea').value;

  var saves = getSaves();
  var existingIdx = -1;
  for (var i = 0; i < saves.length; i++) {
    if (saves[i].name === name) { existingIdx = i; break; }
  }
  var entry = { name: name, timestamp: Date.now(), videos: videos, gifText: gifText };
  if (existingIdx >= 0) {
    saves[existingIdx] = entry;
  } else {
    saves.push(entry);
  }
  setSaves(saves);
  input.value = '';
  renderSaveList();
  showToast('SAVED "' + name + '"', 1800);
}

function renderSaveList() {
  var list = document.getElementById('saveList');
  var saves = getSaves();
  list.innerHTML = '';

  if (saves.length === 0) {
    var empty = document.createElement('div');
    empty.className = 'save-list-empty';
    empty.textContent = 'NO SAVED STATES';
    list.appendChild(empty);
    return;
  }

  saves.slice().sort(function(a, b) { return b.timestamp - a.timestamp; }).forEach(function(save) {
    var item = document.createElement('div');
    item.className = 'save-item';

    var info = document.createElement('div');
    info.className = 'save-item-info';
    var nameEl = document.createElement('div');
    nameEl.className = 'save-item-name';
    nameEl.textContent = save.name;
    var metaEl = document.createElement('div');
    metaEl.className = 'save-item-meta';
    metaEl.textContent = new Date(save.timestamp).toLocaleString();
    info.appendChild(nameEl);
    info.appendChild(metaEl);

    var loadBtn = document.createElement('button');
    loadBtn.className = 'save-item-btn';
    loadBtn.textContent = 'LOAD';
    loadBtn.onclick = function() { loadState(save.name); };

    var delBtn = document.createElement('button');
    delBtn.className = 'save-item-btn danger';
    delBtn.textContent = 'DEL';
    delBtn.onclick = function() { deleteState(save.name); };

    item.appendChild(info);
    item.appendChild(loadBtn);
    item.appendChild(delBtn);
    list.appendChild(item);
  });
}

function loadState(name) {
  var saves = getSaves();
  var save = null;
  for (var i = 0; i < saves.length; i++) {
    if (saves[i].name === name) { save = saves[i]; break; }
  }
  if (!save) return;

  for (var n = 1; n <= 3; n++) {
    var url = (save.videos && save.videos[n - 1]) || '';
    document.getElementById('url' + n).value = url;
    if (url) loadVideo(n);
  }

  document.getElementById('gifTextarea').value = save.gifText || '';
  if (save.gifText && save.gifText.trim().length > 0) {
    loadGifQueue();
  }

  toggleMenu();
  showToast('LOADED "' + name + '"', 2000);
}

function deleteState(name) {
  var saves = getSaves().filter(function(s) { return s.name !== name; });
  setSaves(saves);
  renderSaveList();
  showToast('DELETED "' + name + '"', 1500);
}

// ── INIT ──────────────────────────────────────────────────
// Prevent zoom on double-tap
var lastTap = 0;
document.addEventListener('touchend', function(e) {
  var now = Date.now();
  if (now - lastTap < 300) e.preventDefault();
  lastTap = now;
}, { passive: false });
</script>
